<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="theme-color" content="#0f6e56"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AnggaranKu"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnggaranKu</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#0f6e56;--bd:#e3e1da;--bad:#b3261e;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--cd:#222220;--tx:#efeee9;--mu:#a09f98;--ac:#4fc3a1;--bd:#383835;--bad:#f2b8b5;--on:#10201b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171716;--cd:#222220;--tx:#efeee9;--mu:#a09f98;--ac:#4fc3a1;--bd:#383835;--bad:#f2b8b5;--on:#10201b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;padding:10px 14px 0;border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0 0 8px}
nav{display:flex;gap:4px}
nav button{flex:1;padding:9px 4px;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.grid .card{margin:0}
.k{color:var(--mu);font-size:12px}.v{font-size:20px;font-weight:700;margin:2px 0}
.v.bad,.bad{color:var(--bad)}.v.ok{color:var(--ac)}
.mu{color:var(--mu)}.s{font-size:12px}
.row{margin:10px 0 2px}.rt{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ac)}.bar i.o{background:var(--bad)}
.act{display:flex;align-items:center;gap:6px;font-size:12px}
.tx{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.tx:first-of-type{border-top:0}
.r{text-align:right;white-space:nowrap}
.out{color:var(--bad)}.in{color:var(--ac)}
input,select,textarea{width:100%;padding:10px;margin:0 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{height:90px;font-size:12px}
button{font:inherit;cursor:pointer;padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font-weight:600}
button.g{background:var(--bd);color:var(--tx)}
button.l{background:none;color:var(--ac);padding:4px 6px;font-size:12px;font-weight:600}
label{display:block;font-size:12px;color:var(--mu)}
label.ck{display:flex;gap:8px;align-items:center;margin-bottom:8px}label.ck input{width:auto;margin:0}
.h{display:none}
</style></head><body>
<header><h1>AnggaranKu <span id="st" class="mu s"></span></h1><nav>
<button data-t="sum" onclick="go('sum')">Ringkasan</button>
<button data-t="bud" onclick="go('bud')">Anggaran</button>
<button data-t="tx" onclick="go('tx')">Transaksi</button>
<button data-t="acc" onclick="go('acc')">Akun</button></nav></header>
<main id="v"></main>
<script>
const K='anggaranku-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const rp=n=>(n<0?'−':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const today=()=>new Date().toISOString().slice(0,10);
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){return{month:today().slice(0,7),accounts:[],funds:[],items:[],tx:[]}}
function load(){try{const r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(x){}return seed()}
let S=load(),tab='sum',ref=null;
const st=t=>{const x=document.getElementById('st');if(x)x.textContent=t};
const cp=o=>JSON.parse(JSON.stringify(o));
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}
if(ref){st('Menyimpan…');ref.set(cp(S)).then(()=>st('Tersimpan di server')).catch(()=>st('Gagal simpan ke server'))}}
async function pull(){if(!ref)return;try{const s=await ref.get();if(s.exists){S=cp(s.data());try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}R();st('Tersinkron')}else{await ref.set(cp(S));st('Tersimpan di server')}}catch(x){st('Server tidak terjangkau')}}
(async()=>{try{if(typeof claude==='undefined'){st('Tersimpan di perangkat ini');return}const u=await claude.use('user'),d=await claude.use('db');if(!u){st('Hanya di perangkat ini (user tidak aktif)');return}if(!d){st('Hanya di perangkat ini (db tidak aktif)');return}const id=await u.id();if(!id){st('Hanya di perangkat ini (belum terdeteksi login)');return}ref=d.doc('data/users/'+id+'/state');await pull()}catch(x){st('Hanya di perangkat ini (error: '+((x&&x.code)||(x&&x.message)||x)+')')}})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
const A=id=>S.accounts.find(a=>a.id===id);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function bal(a){let b=a.init;for(const t of S.tx){if(t.type==='in'&&t.acc===a.id)b+=t.amt;else if(t.type==='out'&&t.acc===a.id)b-=t.amt;else if(t.type==='tf'){if(t.acc===a.id)b-=t.amt;if(t.to===a.id)b+=t.amt}}return b}
const spent=i=>sum(S.tx.filter(t=>t.type==='out'&&t.item===i.id),t=>t.amt);
const items=()=>S.items.filter(i=>i.m===S.month);
const txs=()=>S.tx.slice().sort((a,b)=>a.date<b.date?-1:1);
function calc(){const op=sum(S.accounts.filter(a=>!a.prot),bal)-sum(S.funds,f=>f.amt);
const prot=sum(S.accounts.filter(a=>a.prot),bal)+sum(S.funds,f=>f.amt);
const rem=sum(items(),i=>Math.max(0,i.b-spent(i)));
const out=sum(S.tx.filter(t=>t.type==='out'&&t.date.slice(0,7)===S.month),t=>t.amt);
return{op,prot,rem,proj:op-rem,out}}
const num=id=>Math.round(+document.getElementById(id).value)||0;
const val=id=>document.getElementById(id).value.trim();
const card=(k,v,s,c)=>`<div class="card"><div class="k">${k}</div><div class="v ${c||''}">${v}</div><div class="k">${s}</div></div>`;
const bar=(n,s,b)=>`<div class="row"><div class="rt"><span>${e(n)}</span><span class="mu">${rp(s)} / ${rp(b)}</span></div><div class="bar"><i class="${s>b?'o':''}" style="width:${b?Math.min(100,s/b*100):0}%"></i></div></div>`;
function txList(l,d){return l.length?l.map(t=>{const sg=t.type==='out'?'−':t.type==='in'?'+':'⇄';
const w=t.type==='tf'?`${e(A(t.acc)?.name)} → ${e(A(t.to)?.name)}`:`${e(A(t.acc)?.name||'?')}${t.cat?' · '+e(t.cat):''}`;
return `<div class="tx"><div><b>${e(t.name)}</b><div class="mu s">${t.date} · ${w}</div></div><div class="r"><span class="${t.type}">${sg}${rp(t.amt)}</span>${d?`<div><button class="l" onclick="editTx('${t.id}')">Ubah</button><button class="l" onclick="delTx('${t.id}')">Hapus</button></div>`:''}</div></div>`}).join(''):'<p class="mu">Belum ada transaksi.</p>'}
function vSum(){const c=calc(),cats={};
items().forEach(i=>{const o=cats[i.cat]||(cats[i.cat]={b:0,s:0});o.b+=i.b;o.s+=spent(i)});
return `<div class="grid">${card('Saldo operasional',rp(c.op),'Uang yang boleh dipakai')}${card('Kebutuhan tersisa',rp(c.rem),'Anggaran belum terpakai')}${card('Proyeksi sisa akhir bulan',rp(c.proj),'Operasional − kebutuhan tersisa',c.proj<0?'bad':'ok')}${card('Dana terproteksi',rp(c.prot),'Tidak ikut terpotong')}</div>
<div class="card"><h3>Terpakai per kategori · keluar bulan ini ${rp(c.out)}</h3>${Object.entries(cats).map(([k,v])=>bar(k,v.s,v.b)).join('')||'<p class="mu">Belum ada anggaran bulan ini.</p>'}</div>
<div class="card"><h3>Transaksi terakhir</h3>${txList(txs().slice(-5).reverse(),false)}</div>`}
function vBud(){const its=items(),cats=[...new Set(its.map(i=>i.cat))];
return `<div class="card"><label>Bulan<input type="month" value="${S.month}" onchange="if(this.value){S.month=this.value;save();R()}"></label><button class="g" onclick="copyPrev()">Salin dari bulan sebelumnya</button></div>`
+cats.map(c=>`<div class="card"><h3>${e(c)}</h3>${its.filter(i=>i.cat===c).map(i=>{const s=spent(i);return bar(i.name,s,i.b)+`<div class="act mu">Sisa ${rp(Math.max(0,i.b-s))}<button class="l" onclick="editItem('${i.id}')">Ubah</button><button class="l" onclick="delItem('${i.id}')">Hapus</button></div>`}).join('')}</div>`).join('')
+`<div class="card"><h3>Tambah kebutuhan</h3><input id="ic" list="cl" placeholder="Kategori (mis. Makanan)"><datalist id="cl">${[...new Set(S.items.map(i=>i.cat))].map(c=>`<option value="${e(c)}">`).join('')}</datalist><input id="in" placeholder="Nama item (mis. Susu)"><input id="ib" type="number" inputmode="numeric" placeholder="Anggaran (Rp)"><button onclick="addItem()">Tambah</button></div>`}
function vTx(){const ac=S.accounts.map(a=>`<option value="${a.id}">${e(a.name)}</option>`).join('');
const op=items().map(i=>`<option value="${i.id}">${e(i.cat)} · ${e(i.name)} (sisa ${rp(Math.max(0,i.b-spent(i)))})</option>`).join('');
return `<div class="card"><h3>Catat transaksi</h3><select id="tt" onchange="tgl()"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option><option value="tf">Pindah antar akun</option></select><input id="td" type="date" value="${today()}"><input id="tn" placeholder="Nama (mis. Ayam rumahan)"><input id="ta" type="number" inputmode="numeric" placeholder="Nominal (Rp)"><label>Akun (asal)<select id="tc">${ac}</select></label><label id="tzl" class="h">Akun tujuan<select id="tz">${ac}</select></label><div id="to"><label>Masuk ke item anggaran<select id="ti" onchange="tgl()"><option value="">Di luar rencana</option>${op}</select></label><input id="tk" list="cl" placeholder="Kategori (di luar rencana)" value="Makanan"></div><button onclick="addTx()">Simpan</button></div>
<div class="card"><h3>Riwayat</h3>${txList(txs().reverse(),true)}</div>`}
function vAcc(){return `<div class="card"><h3>Akun</h3>${S.accounts.map(a=>`<div class="tx"><div><b>${e(a.name)}</b><div class="mu s">${a.prot?'Terproteksi penuh':'Operasional'}</div></div><div class="r"><span>${rp(bal(a))}</span><div><button class="l" onclick="setBal('${a.id}')">Koreksi saldo</button><button class="l" onclick="delAcc('${a.id}')">Hapus</button></div></div></div>`).join('')}<input id="an" placeholder="Nama akun baru"><input id="ab" type="number" inputmode="numeric" placeholder="Saldo awal (Rp)"><label class="ck"><input type="checkbox" id="ap"> Seluruhnya dana terproteksi</label><button onclick="addAcc()">Tambah akun</button></div>
<div class="card"><h3>Alokasi terproteksi</h3><p class="mu s">Bagian dari saldo akun operasional yang tidak boleh dipakai belanja. Sudah ada di saldo akun, jadi tidak dihitung dua kali.</p>${S.funds.map(f=>`<div class="tx"><div><b>${e(f.name)}</b></div><div class="r"><span>${rp(f.amt)}</span><div><button class="l" onclick="editFund('${f.id}')">Ubah</button><button class="l" onclick="delFund('${f.id}')">Hapus</button></div></div></div>`).join('')}<input id="fn" placeholder="Nama alokasi"><input id="fa" type="number" inputmode="numeric" placeholder="Nominal (Rp)"><button onclick="addFund()">Tambah alokasi</button></div>
<div class="card"><h3>Cadangan data</h3><p class="mu s">Data tersimpan di browser perangkat ini saja. Salin cadangan lalu tempel di perangkat lain untuk memindahkannya.</p><textarea id="bk" placeholder="Teks cadangan muncul di sini, atau tempel cadangan untuk dipulihkan"></textarea><button onclick="exp()">Tampilkan dan salin cadangan</button> <button class="g" onclick="imp()">Pulihkan dari teks</button></div>`}
function R(){document.getElementById('v').innerHTML=({sum:vSum,bud:vBud,tx:vTx,acc:vAcc})[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));if(tab==='tx')tgl()}
function go(t){tab=t;R();scrollTo(0,0)}
function tgl(){const t=val('tt');document.getElementById('tzl').classList.toggle('h',t!=='tf');document.getElementById('to').classList.toggle('h',t!=='out');document.getElementById('tk').classList.toggle('h',val('ti')!=='')}
function addItem(){const c=val('ic'),n=val('in'),b=num('ib');if(!c||!n||b<=0)return alert('Isi kategori, nama, dan nominal.');S.items.push({id:uid(),m:S.month,cat:c,name:n,b});save();R()}
function editItem(id){const i=S.items.find(x=>x.id===id),v=prompt('Anggaran baru untuk '+i.name+' (Rp)',i.b);if(v===null)return;const n=Math.round(+v);if(n>=0){i.b=n;save();R()}}
function delItem(id){if(!confirm('Hapus item dari rencana? Transaksi lama tetap tersimpan.'))return;S.tx.forEach(t=>{if(t.item===id)t.item=null});S.items=S.items.filter(i=>i.id!==id);save();R()}
function copyPrev(){const [y,m]=S.month.split('-').map(Number),d=new Date(y,m-2,1),p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),src=S.items.filter(i=>i.m===p);if(!src.length)return alert('Tidak ada anggaran di bulan sebelumnya.');if(items().length&&!confirm('Bulan ini sudah ada anggaran. Tambahkan salinan?'))return;src.forEach(i=>S.items.push({...i,id:uid(),m:S.month}));save();R()}
function addTx(){const type=val('tt'),amt=num('ta'),name=val('tn')||({out:'Pengeluaran',in:'Pemasukan',tf:'Pindah dana'})[type],acc=val('tc'),to=val('tz'),date=val('td')||today();let item=null,cat='';
if(amt<=0)return alert('Nominal harus lebih dari 0.');
if(type==='tf'&&acc===to)return alert('Akun asal dan tujuan harus berbeda.');
if(type==='out'){item=val('ti')||null;
if(item){const it=S.items.find(x=>x.id===item);cat=it.cat;if(spent(it)+amt>it.b&&!confirm('Melebihi anggaran '+it.name+' (sisa '+rp(Math.max(0,it.b-spent(it)))+'). Tetap simpan?'))return}else cat=val('tk')||'Lainnya';
if(!A(acc).prot&&amt>calc().op&&!confirm('Nominal melebihi saldo operasional. Tetap simpan?'))return}
S.tx.push({id:uid(),type,date,name,amt,acc,to:type==='tf'?to:null,item,cat});save();R()}
function editTx(id){const t=S.tx.find(x=>x.id===id),v=prompt('Nominal baru (Rp) untuk '+t.name,t.amt);if(v===null)return;const n=Math.round(+v);if(n>0){t.amt=n;save();R()}}
function delTx(id){if(confirm('Hapus transaksi? Saldo dan anggaran dihitung ulang otomatis.')){S.tx=S.tx.filter(t=>t.id!==id);save();R()}}
function setBal(id){const a=A(id),v=prompt('Saldo aktual '+a.name+' saat ini (Rp)',bal(a));if(v===null)return;const n=Math.round(+v);if(!isNaN(n)){a.init+=n-bal(a);save();R()}}
function delAcc(id){if(S.tx.some(t=>t.acc===id||t.to===id))return alert('Akun masih punya transaksi, tidak bisa dihapus.');if(confirm('Hapus akun ini?')){S.accounts=S.accounts.filter(a=>a.id!==id);save();R()}}
function addAcc(){const n=val('an');if(!n)return;S.accounts.push({id:uid(),name:n,init:num('ab'),prot:document.getElementById('ap').checked});save();R()}
function addFund(){const n=val('fn'),a=num('fa');if(!n||a<=0)return alert('Isi nama dan nominal.');S.funds.push({id:uid(),name:n,amt:a});save();R()}
function editFund(id){const f=S.funds.find(x=>x.id===id),v=prompt('Nominal baru untuk '+f.name+' (Rp)',f.amt);if(v===null)return;const n=Math.round(+v);if(n>=0){f.amt=n;save();R()}}
function delFund(id){if(confirm('Hapus alokasi ini? Uangnya akan masuk ke saldo operasional.')){S.funds=S.funds.filter(f=>f.id!==id);save();R()}}
function exp(){const t=document.getElementById('bk');t.value=JSON.stringify(S);t.select();try{document.execCommand('copy')}catch(x){}}
function imp(){try{const d=JSON.parse(val('bk'));if(!d.accounts||!d.tx||!d.items)throw 0;if(!confirm('Timpa semua data di perangkat ini dengan cadangan?'))return;S=d;save();R()}catch(x){alert('Teks cadangan tidak valid.')}}
R();
</script></body></html>
